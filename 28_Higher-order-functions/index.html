<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Sales Dashboard - Higher Order Functions</title>
    <style>
        body{
            font-family:Arial;
            max-width:900px;
            margin:40px auto;
            padding:20px;
            background:#f5f7fb
        }
        .controls{
            display:flex;
            gap:10px;
            flex-wrap:wrap
        }
        .card{
            background:white;
            padding:18px;
            margin-top:16px;
            border-radius:12px;
            box-shadow:0 2px 10px #0001
        }
        button{
            padding:9px 13px;
            border:0;
            border-radius:7px;
            cursor:pointer
        }
        table{
            width:100%;
            border-collapse:collapse;
            margin-top:12px
        }td,th{
            padding:9px;
            text-align:left;
            border-bottom:1px solid #ddd
        }
    </style>
</head>
<body>
    <h1>Sales Dashboard</h1>
    <div class="controls">
        <button id="all">All</button><button id="paid">Paid</button><button id="high">Above ₹5000</button>
    </div>
    
    <div class="card">
        <p>Total Revenue: <strong id="revenue"></strong></p>
        <table><thead><tr><th>Order</th><th>Customer</th><th>Amount</th><th>Status</th></tr></thead>
        <tbody id="rows"></tbody></table>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
