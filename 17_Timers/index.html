<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Timer</title>
</head>

<body>

    <div class="checkout">
        <h1>Checkout</h1>
        <p>Product: Wireless Headphones</p>
        <p>Price: ₹2,499</p>

        <div class="timer">
            <span id="time">10</span>
            seconds remaining
        </div>

        <button id="startBtn">Start Checkout</button>
        <button id="cancelBtn" disabled>Cancel Checkout</button>
        <p id="message"></p>
    </div>
    <script src="./script.js"></script>
</body>
</html>
