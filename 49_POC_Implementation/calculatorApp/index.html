<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glass Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="calculator">

      <div class="topBar">

        <h1 class="title">Calculator</h1>
        <button id="themeToggle" class="themeToggle" aria-label="Toggle theme">
          🌙
        </button>
      </div>

      <div class="display">
        <div id="previousDisplay" class="previousDisplay"></div>
        <div id="currentDisplay" class="currentDisplay">0</div>
      </div>

      <div id="buttons" class="buttons">
        <button data-action="clear" class="btn function">AC</button>
        <button data-action="delete" class="btn function">DEL</button>
        <button data-action="percent" class="btn function">%</button>
        <button data-action="operator" data-value="/" class="btn operator">÷</button>
        <button data-action="number" data-value="7" class="btn">7</button>
        <button data-action="number" data-value="8" class="btn">8</button>
        <button data-action="number" data-value="9" class="btn">9</button>
        <button data-action="operator" data-value="*" class="btn operator">×</button>
        <button data-action="number" data-value="4" class="btn">4</button>
        <button data-action="number" data-value="5" class="btn">5</button>
        <button data-action="number" data-value="6" class="btn">6</button>
        <button data-action="operator" data-value="-" class="btn operator">−</button>
        <button data-action="number" data-value="1" class="btn">1</button>
        <button data-action="number" data-value="2" class="btn">2</button>
        <button data-action="number" data-value="3" class="btn">3</button>
        <button data-action="operator" data-value="+" class="btn operator">+</button>
        <button data-action="number" data-value="0" class="btn zero">0</button>
        <button data-action="number" data-value="." class="btn">.</button>
        <button data-action="equals" class="btn equals">=</button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
