<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Invoice Text Processor - RegEx</title>
    <style>
        body{
            font-family:Arial;
            max-width:850px;
            margin:40px auto;
            padding:20px;
            background:#f5f7fb
        }
        .card{
            background:white;
            padding:20px;
            border-radius:12px;
            box-shadow:0 2px 10px #0001;
            margin-bottom:15px
        }
        textarea,input{
            width:100%;
            box-sizing:border-box;
            padding:10px;
            margin:8px 0
        }
        button{
            padding:10px 14px;
            border:0;
            border-radius:7px;
            cursor:pointer
        }
        .ok{
            font-weight:bold
        }
    </style>
</head>
<body>
    <h1>Invoice Text Processor</h1>
    <div class="card">
        <label>Invoice ID</label>
        <input id="invoice" value="INV-2026-0045">
        <button id="validate">Validate Invoice</button>
        <p id="validation"></p>
    </div>

    <div class="card">
        <label>Imported invoice text</label>
        <textarea id="text" rows="7">
            Invoice INV-2026-0045
            Invoice INV-2026-0098
            Invoice INV-2026-0120
            Customer phone: +91 98765-43210</textarea>
        <button id="extract">Extract IDs & Clean Phone</button>
        <pre id="output"></pre>
    </div>
    
    <script src="script.js"></script>
</body></html>
