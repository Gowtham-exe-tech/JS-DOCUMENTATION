<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Profile Editor</title>
    <style>
        body{
            font-family:Arial;
            max-width:700px;
            margin:40px auto;
            padding:20px;
            background:#f5f7fb
        }
        .card{
            background:white;
            padding:22px;
            border-radius:12px;
            box-shadow:0 2px 10px #0001
        }
        input{
            display:block;
            width:100%;
            padding:10px;
            margin:10px 0;
            box-sizing:border-box
        }
        button{
            padding:10px 14px;
            margin:5px 0;
            border:0;
            border-radius:7px;
            cursor:pointer
        }
        pre{
            background:#111;
            color:#eee;
            padding:15px;
            border-radius:8px;
            white-space:pre-wrap
        }

    </style>
</head>
<body>
    <div class="card">
        <h1>Profile Editor</h1>
        <input id="name" placeholder="Name">
        <input id="email" placeholder="Email">
        <button id="save">Save Profile</button>
        <button id="logout">Logout</button>
        <pre id="output"></pre>
    </div>

    <script src="script.js"></script>
</body>
</html>
