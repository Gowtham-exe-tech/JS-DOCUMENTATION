<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Browser JS Notes App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Notes App (click a note to delete)</h1>
<nav><button id="homeBtn">Home</button><button id="allBtn">All notes (history)</button></nav>
<div id="homeView" class="box"><input id="noteInput" placeholder="write note and press Enter"><button id="addBtn">Add</button><button id="recordBtn">Record 3s voice</button><ul id="notes"></ul></div>
<div id="allView" class="box hidden"><p>Total notes: <b id="count">0</b>. Press browser back button.</p></div>
<script src="script.js"></script>
</body>
</html>
